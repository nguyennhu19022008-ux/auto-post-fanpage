<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="hard-shadow" x="0" y="0" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feOffset dx="16" dy="16"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.094  0 0 0 0 0.094  0 0 0 0 0.106  0 0 0 1 0"/>
      <feBlend in="SourceGraphic" in2="hard-shadow"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="100" fill="#FDFBF7"/>

  <!-- Neo-Brutalist Hard Shadow Card -->
  <rect x="40" y="40" width="416" height="416" rx="72" fill="#18181B"/>
  <rect x="32" y="32" width="416" height="416" rx="72" fill="#FDE047" stroke="#18181B" stroke-width="14"/>

  <!-- Inner Badge: VG Monogram -->
  <text x="240" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="#18181B" text-anchor="middle" letter-spacing="-4">VG</text>

  <!-- Laptop Silhouette -->
  <!-- Screen Lid -->
  <rect x="146" y="280" width="188" height="116" rx="12" fill="#FFFFFF" stroke="#18181B" stroke-width="12"/>
  <rect x="166" y="298" width="148" height="80" rx="6" fill="#18181B"/>
  <!-- Screen glow content -->
  <path d="M 186 338 L 220 318 L 260 348 L 294 326" fill="none" stroke="#FDE047" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Laptop Base / Keyboard -->
  <path d="M 116 404 L 364 404 L 350 424 L 130 424 Z" fill="#E4E4E7" stroke="#18181B" stroke-width="12" stroke-linejoin="round"/>
  <line x1="216" y1="416" x2="264" y2="416" stroke="#18181B" stroke-width="8" stroke-linecap="round"/>

  <!-- Top Right Pro Craft Sticker -->
  <g transform="translate(320, 50) rotate(12)">
    <rect width="110" height="38" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="6"/>
    <text x="55" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#18181B" text-anchor="middle">PRO APP</text>
  </g>
</svg>
