<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Laptop Vương Gia // Autopost App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FDFBF7;
      color: #18181B;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #18181B;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .badge-icon {
      background: #FDE047;
      width: 36px;
      height: 36px;
      border: 2px solid #18181B;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      box-shadow: 2px 2px 0px #18181B;
    }
    .title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 11px;
      color: #71717A;
      font-weight: 600;
    }
    .tabs-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      border: 2px solid #18181B;
      border-radius: 6px;
      background: #FFFFFF;
      cursor: pointer;
      box-shadow: 2px 2px 0px #18181B;
      transition: all 0.1s ease;
    }
    .tab-btn.active {
      background: #FDE047;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #18181B;
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }
    .card {
      background: #FFFFFF;
      border: 2px solid #18181B;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 3px 3px 0px #18181B;
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }
    .textarea {
      width: 100%;
      height: 90px;
      padding: 8px;
      border: 2px solid #18181B;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      background: #FAF8F5;
      resize: vertical;
    }
    .textarea:focus {
      background: #FFFFFF;
      border-color: #4F46E5;
    }
    .input {
      width: 100%;
      padding: 7px 10px;
      border: 2px solid #18181B;
      border-radius: 6px;
      font-size: 11.5px;
      outline: none;
      background: #FAF8F5;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .btn {
      width: 100%;
      border: 2px solid #18181B;
      border-radius: 6px;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 2px 2px 0px #18181B;
      transition: transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
    }
    .btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #18181B;
    }
    .btn-dual {
      background: #FB923C;
      color: #431407;
      grid-column: span 2;
      padding: 9px;
      font-size: 12px;
    }
    .btn-fanpage {
      background: #FDE047;
      color: #18181B;
    }
    .btn-personal {
      background: #38BDF8;
      color: #082F49;
    }
    .btn-schedule {
      background: #EEF2FF;
      color: #312E81;
      grid-column: span 2;
    }
    .status-msg {
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1.5px solid #18181B;
      display: none;
    }
    .status-msg.loading {
      display: block;
      background: #FEF08A;
      color: #854D0E;
    }
    .status-msg.success {
      display: block;
      background: #DCFCE7;
      color: #166534;
    }
    .status-msg.error {
      display: block;
      background: #FEE2E2;
      color: #991B1B;
    }
    .media-preview {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-top: 6px;
      padding-bottom: 4px;
    }
    .media-thumb {
      width: 44px;
      height: 44px;
      border: 1.5px solid #18181B;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge-icon">VG</div>
    <div>
      <div class="title">Laptop Vương Gia</div>
      <div class="subtitle">Hệ Thống Autopost Cá Nhân + Nhóm v1.4.2</div>
    </div>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="tab-compose">⚡ Soạn & Đăng</button>
    <button class="tab-btn" data-tab="tab-settings">⚙️ Cài Đặt</button>
  </div>

  <!-- TAB 1: SOẠN & ĐĂNG BÀI NHANH -->
  <div id="tab-compose" class="tab-pane active">
    <div class="card">
      <label class="label">Nội dung cấu hình từ Zalo / Kho:</label>
      <textarea id="rawTextInput" class="textarea" placeholder="Ví dụ: Mã 09: HP Probook 430 G8 i5-11Th/16/256/13.3 vỏ nhôm. Giá 7.x tr..."></textarea>
      
      <div style="margin-top: 8px;">
        <label class="label">Đính kèm ảnh máy HD:</label>
        <input type="file" id="mediaFileInput" multiple accept="image/*" class="input" style="padding: 4px 6px;">
        <div id="mediaPreview" class="media-preview"></div>
      </div>

      <div class="btn-grid" style="grid-template-columns: 1fr; gap: 8px;">
        <button id="btnDualPost" class="btn btn-dual">🚀 ĐĂNG NGAY (FANPAGE + CÁ NHÂN)</button>
        <button id="btnSchedulePost" class="btn btn-schedule">⏳ LÊN LỊCH HÀNG ĐỢI (CẢ HAI)</button>
      </div>

      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div id="quickGroupBar" style="background:#FFFFFF; border:2px solid #18181B; border-radius:8px; padding:8px 10px; margin-bottom:10px; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:8px;">
      <span id="quickGroupLabel">📢 Hội Nhóm: Đang kiểm tra...</span>
      <button id="quickGroupActionBtn" class="btn btn-fanpage" style="width:auto; padding:4px 8px; font-size:10px;">🔍 Quét Nhóm</button>
    </div>

    <button id="openFullAppBtn" class="btn" style="background: #FFFFFF; width: 100%;">
      🌐 Mở Web App Dashboard (/app) ➔
    </button>
  </div>

  <!-- TAB 2: CÀI ĐẶT -->
  <div id="tab-settings" class="tab-pane">
    <div class="card">
      <label class="label">🤖 Tự động Trang Cá Nhân (khi mở Chrome):</label>
      <label style="display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; margin-bottom:6px; cursor:pointer;">
        <input type="checkbox" id="autoPersonalToggle" checked style="width:15px; height:15px;">
        <span>Tự quét & đăng bài đến giờ mỗi 1 phút</span>
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; margin-bottom:8px; cursor:pointer; color:#3F3F46;">
        <input type="checkbox" id="autoFanpageSyncToggle" checked style="width:15px; height:15px;">
        <span>Tự đăng đồng bộ bài Fanpage mới sang Cá Nhân</span>
      </label>
      <div id="autoPersonalStatus" style="font-size:10.5px; color:#52525B; font-weight:600; background:#F4F4F5; padding:6px 8px; border-radius:6px; border:1px solid #D4D4D8;">
        Đang tải trạng thái lịch hẹn...
      </div>
      <button id="checkDueNowBtn" class="btn btn-personal" style="margin-top:8px;">⚡ Quét & Đăng Ngay Bài Đến Giờ</button>
    </div>

    <div class="card">
      <label class="label">📢 Tự động chia sẻ Hội Nhóm Facebook:</label>
      <label style="display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; margin-bottom:6px; cursor:pointer;">
        <input type="checkbox" id="autoGroupShareToggle" checked style="width:15px; height:15px;">
        <span>Tự chia sẻ sang Group sau khi đăng Cá Nhân</span>
      </label>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <span style="font-size:11px; font-weight:700; flex:1;">Số nhóm xoay vòng mỗi bài (giãn 3 phút/nhóm):</span>
        <input type="number" id="groupsPerPostInput" min="1" max="10" value="3" class="input" style="width:62px; text-align:center; font-weight:800;">
      </div>
      <label class="label" style="margin-top:4px;">Danh sách Link Group mục tiêu (mỗi dòng 1 link):</label>
      <textarea id="groupUrlsInput" class="textarea" style="height:68px; font-size:11px;" placeholder="https://www.facebook.com/groups/tennhomlaptop/&#10;https://www.facebook.com/groups/chototlaptop/"></textarea>
      <div id="groupShareStatus" style="font-size:10.5px; color:#52525B; font-weight:600; background:#F4F4F5; padding:6px 8px; border-radius:6px; border:1px solid #D4D4D8; margin-top:6px;">
        Chưa có nhóm được cấu hình (bấm Quét Nhóm hoặc dán link).
      </div>
      <div class="btn-grid">
        <button id="scanGroupsBtn" class="btn btn-fanpage">🔍 Quét Nhóm Của Tôi</button>
        <button id="shareGroupsNowBtn" class="btn btn-personal">📢 Chia Sẻ Nhóm Ngay</button>
      </div>
    </div>

    <div class="card">
      <label class="label">Địa chỉ máy chủ (Backend):</label>
      <input type="text" id="backendUrlInput" class="input" value="https://auto-post-fanpage-coral.vercel.app">
      
      <div id="connectionStatus" style="font-size: 11px; font-weight: 800; margin-top: 8px; color: #166534;">
        ● Đang kiểm tra kết nối...
      </div>

      <button id="saveBtn" class="btn btn-fanpage" style="margin-top: 10px;">💾 Lưu Cấu Hình</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
